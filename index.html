<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NERIST Campus Delivery Service</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
    }
    .card {
      max-width: 450px;
      margin: 20px auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
    }
    h2 {
      text-align: center;
      color: #2c3e50;
      margin-top: 0;
    }
    .price-tag {
      background: #e8f8f5;
      color: #117a65;
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
      margin-bottom: 15px;
      text-align: center;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 12px;
      color: #333;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      background-color: #25d366;
      color: white;
      font-size: 16px;
      font-weight: bold;
      padding: 12px;
      border: none;
      border-radius: 5px;
      margin-top: 20px;
      cursor: pointer;
    }
    button:hover {
      background-color: #1eb857;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>🚀 NERIST Gate-to-Hostel Delivery</h2>
  
  <div class="price-tag">
    💰 <b>Delivery Charges:</b><br>
    Small Package: <b>₹30</b> | Big Package: <b>₹50</b>
  </div>

  <form id="orderForm">
    <label for="name">Your Name:</label>
    <input type="text" id="name" placeholder="e.g. Rahul Sharma" required>

    <label for="hostel">Hostel & Room No.:</label>
    <input type="text" id="hostel" placeholder="e.g. Block B, Room 204" required>

    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" placeholder="e.g. 9876543210" required>

    <label for="packageType">Package Size:</label>
    <select id="packageType" required>
      <option value="Small Order (₹30)">Small Order - Food/Small Parcel (₹30)</option>
      <option value="Big Order (₹50)">Big Order - Heavy/Multiple Packages (₹50)</option>
    </select>

    <label for="details">Order Details / Delivery Company:</label>
    <textarea id="details" rows="3" placeholder="e.g. Zomato order under name Rahul / Amazon parcel OTP..." required></textarea>

    <button type="button" onclick="sendOrder()">Place Order via WhatsApp</button>
  </form>
</div>

<script>
  function sendOrder() {
    // ⚠️ REPLACE THIS NUMBER WITH YOUR OWN PHONE NUMBER (With country code 91, no plus sign)
    var myPhoneNumber = "919863004858"; 

    var name = document.getElementById("name").value;
    var hostel = document.getElementById("hostel").value;
    var phone = document.getElementById("phone").value;
    var packageType = document.getElementById("packageType").value;
    var details = document.getElementById("details").value;

    if(!name || !hostel || !phone || !details) {
      alert("Please fill in all details before placing the order.");
      return;
    }

    var message = "*NEW NERIST DELIVERY ORDER*%0A%0A" +
      "*Name:* " + encodeURIComponent(name) + "%0A" +
      "*Hostel/Room:* " + encodeURIComponent(hostel) + "%0A" +
      "*Phone:* " + encodeURIComponent(phone) + "%0A" +
      "*Delivery Type:* " + encodeURIComponent(packageType) + "%0A" +
      "*Order Details:* " + encodeURIComponent(details);

    var whatsappURL = "https://wa.me/" + myPhoneNumber + "?text=" + message;
    
    window.open(whatsappURL, '_blank');
  }
</script>

</body>
</html>
